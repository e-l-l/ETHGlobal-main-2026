# One-box deployment: Caddy (HTTPS) in front of the agents API, the agents worker, the merchant app,
# the demo seller portal and the issuer. Only Caddy publishes ports (80/443).
#
# Always run through the wrappers so the right env file is used:
#   ./deploy/deploy.sh            build + up + health checks + URLs
#   ./deploy/compose.sh <args>    any docker compose command (ps, restart app, exec agents-api sh, ...)
#   ./deploy/logs.sh [service]    follow logs
#
# Interpolation values (${...}) come from deploy/env/compose.env (passed with --env-file).
# Per-service runtime env comes from deploy/env/<service>.env (git-ignored; templates in *.env.example).
# Note: `environment:` entries below override the same key in an env_file. They are wiring only, no secrets.

name: mra

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-agents-env: &agents-env
  DB_PATH: /srv/agents/data/agents.sqlite
  DEPLOYMENTS_FILE: /srv/agents/deployments/${DEPLOYMENTS_NAME:-sepolia}.json

services:
  agents-api:
    <<: [*restart, *logging]
    build:
      context: ../agents
      dockerfile: Dockerfile
    image: mra-agents:local
    init: true
    env_file:
      - path: ./env/agents.env
        required: true
    environment:
      <<: *agents-env
    volumes:
      - agents-data:/srv/agents/data
      - ../agents/deployments:/srv/agents/deployments:ro
    networks: [internal]
    expose: ["8787"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 768m

  agents-worker:
    <<: [*restart, *logging]
    # Same image as agents-api (built by that service; deploy.sh builds it first).
    image: mra-agents:local
    pull_policy: never
    init: true
    # Runs `python -m mra_agents.worker` if that module exists (Risk agent + keeper + MerchantAgentRunner),
    # otherwise a fallback Risk + keeper loop shipped in deploy/agents/worker_entry.py.
    command: ["python", "/srv/deploy/worker_entry.py"]
    env_file:
      - path: ./env/agents.env
        required: true
    environment:
      <<: *agents-env
      WORKER_HEARTBEAT_FILE: /tmp/worker.heartbeat
    volumes:
      - agents-data:/srv/agents/data
      - ../agents/deployments:/srv/agents/deployments:ro
      - ./agents/worker_entry.py:/srv/deploy/worker_entry.py:ro
    networks: [internal]
    depends_on:
      agents-api:
        condition: service_started
    healthcheck:
      # Fresh heartbeat (written by the fallback loop) or, if the real worker writes none, process alive.
      test: ["CMD", "python", "-c", "import os,sys,time; f='/tmp/worker.heartbeat'; sys.exit(0 if not os.path.exists(f) or time.time()-os.path.getmtime(f) < 900 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 768m

  app:
    # Merchant UI (app/, built by the frontend team). Optional: started only with `--profile ui` or when
    # deploy.sh finds app/Dockerfile.
    profiles: ["ui"]
    <<: [*restart, *logging]
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        # Public, build-time values (inlined into the browser bundle). Set them in deploy/env/compose.env.
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-}
        NEXT_PUBLIC_RPC_MODE: ${NEXT_PUBLIC_RPC_MODE:-}
        NEXT_PUBLIC_RECLAIM_MODE: ${NEXT_PUBLIC_RECLAIM_MODE:-}
        NEXT_PUBLIC_WORLD_MODE: ${NEXT_PUBLIC_WORLD_MODE:-}
        NEXT_PUBLIC_AGENT_PASS_MODE: ${NEXT_PUBLIC_AGENT_PASS_MODE:-}
        NEXT_PUBLIC_PROVER_MODE: ${NEXT_PUBLIC_PROVER_MODE:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.${HOST_SUFFIX:-localhost}}
        NEXT_PUBLIC_RPC_URL: ${NEXT_PUBLIC_RPC_URL:-}
        NEXT_PUBLIC_CHAIN_ID: ${NEXT_PUBLIC_CHAIN_ID:-}
        NEXT_PUBLIC_ANON_RPC_SPECIFIER: ${NEXT_PUBLIC_ANON_RPC_SPECIFIER:-}
        NEXT_PUBLIC_ANON_RPC_BOOTSTRAP_URL: ${NEXT_PUBLIC_ANON_RPC_BOOTSTRAP_URL:-}
        NEXT_PUBLIC_ANON_RPC_CONFIG: ${NEXT_PUBLIC_ANON_RPC_CONFIG:-}
        NEXT_PUBLIC_BUSINESS_REGISTRY: ${NEXT_PUBLIC_BUSINESS_REGISTRY:-}
        NEXT_PUBLIC_BIZ_COUNTRY: ${NEXT_PUBLIC_BIZ_COUNTRY:-}
        NEXT_PUBLIC_BIZ_REVENUE_BAND: ${NEXT_PUBLIC_BIZ_REVENUE_BAND:-}
        NEXT_PUBLIC_WORLD_APP_ID: ${NEXT_PUBLIC_WORLD_APP_ID:-}
        NEXT_PUBLIC_WORLD_ACTION: ${NEXT_PUBLIC_WORLD_ACTION:-}
        NEXT_PUBLIC_WORLD_RP_ID: ${NEXT_PUBLIC_WORLD_RP_ID:-}
        NEXT_PUBLIC_AGENT_KEY: ${NEXT_PUBLIC_AGENT_KEY:-}
        NEXT_PUBLIC_DEMO_SHOP_LABEL: ${NEXT_PUBLIC_DEMO_SHOP_LABEL:-}
    image: mra-app:local
    init: true
    env_file:
      - path: ./env/app.env
        required: true
    environment:
      API_URL: http://agents-api:8787
      APP_ORIGIN: https://app.${HOST_SUFFIX:-localhost}
      DEPLOYMENTS_PATH: /srv/deployments/${DEPLOYMENTS_NAME:-sepolia}.json
    volumes:
      - ../agents/deployments:/srv/deployments:ro
    networks: [internal]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 40s
    mem_limit: 1g

  demo-portal:
    <<: [*restart, *logging]
    build:
      context: ../demo/portal
      dockerfile: Dockerfile
    image: mra-demo-portal:local
    init: true
    env_file:
      - path: ./env/demo-portal.env
        required: true
    networks: [internal]
    expose: ["3000"]
    healthcheck:
      # /api/health returns 503 when SESSION_SECRET is missing, so this also catches a bad env file.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    mem_limit: 512m

  issuer:
    <<: [*restart, *logging]
    # issuer/Dockerfile is owned by the issuer agent. deploy.sh skips this service until it exists.
    build:
      context: ../issuer
      dockerfile: Dockerfile
    image: mra-issuer:local
    init: true
    env_file:
      - path: ./env/issuer.env
        required: false
    environment:
      PORT: ${ISSUER_PORT:-4000}
    networks: [internal]
    expose: ["${ISSUER_PORT:-4000}"]
    healthcheck:
      # Assumes a Node base image (global fetch). Adjust ISSUER_HEALTH_PATH in compose.env.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${ISSUER_PORT:-4000}${ISSUER_HEALTH_PATH:-/health}').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 30s
    mem_limit: 512m

  caddy:
    <<: [*restart, *logging]
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      HOST_SUFFIX: ${HOST_SUFFIX:?HOST_SUFFIX is empty; deploy.sh fills it from the instance public IP}
      ISSUER_PORT: ${ISSUER_PORT:-4000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates + ACME account: keep this volume or you re-issue (rate limits)
      - caddy-config:/config
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m

networks:
  internal:
    driver: bridge

volumes:
  agents-data:
  caddy-data:
  caddy-config:
