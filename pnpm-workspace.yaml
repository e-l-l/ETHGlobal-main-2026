packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@parcel/watcher": true
  "pnpm": true
  # optional native msgpack accelerator pulled in by @aztec-foundation/bb.js; the pure-JS path is used
  "msgpackr-extract": false
  # optional native accelerators pulled in by wagmi/RainbowKit wallet connectors; pure-JS fallbacks are used
  "bufferutil": false
  "keccak": false
  "utf-8-validate": false
