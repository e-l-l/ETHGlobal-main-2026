[project]
name = "mra-agents"
version = "0.1.0"
description = "Merchant Revenue Advance: underwriting, critic, risk and relayer service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=0.60",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "web3>=7.0",
  "eth-account>=0.13",
  "httpx>=0.27",
  "boto3>=1.43.124",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mra_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["anvil: needs a local anvil devnet (scripts/devnet.sh)", "live_llm: calls the real Claude API (costs money)"]
addopts = "-m 'not anvil and not live_llm'"

[tool.ruff]
line-length = 110
